# Create Ultimine - Minecraft 1.18.2 Forge port
# Version matrix: MC 1.18.2 / Forge 40.2.21 / Java 17 / Gradle 7.4.2 / ForgeGradle 5.1.x
# Kotlin 1.8.21 / Kotlin for Forge (thedarkcolour) 3.12.0

minecraft_version=1.18.2
minecraft_version_range=[1.18.2,1.19)
forge_version=40.2.21
forge_version_range=[40.2.4,)

kff_version=3.12.0

# Dependencies
ftb_ultimine_version=1802.3.4-build.93
ftb_library_version=1802.3.6-build.115
architectury_version=4.1.36
create_version=0.5.1.i
registrate_version=1.1.3

# Mod metadata
mod_id=createultimine
mod_name=Create Ultimine
mod_license=GNU GPLv3
mod_version=1.3.1-1.18.2
mod_group_id=io.github.chaosunity.createultimine
mod_authors=ChAoS-UnItY
mod_description=A Create mod addon that supports FTB Ultimine functionality (ported to Minecraft 1.18.2)

# Build settings
org.gradle.jvmargs=-Xmx3G -Djava.io.tmpdir=D:/agent/createUltimine/tmp
org.gradle.daemon=false
kotlin.code.style=official

# Workspace-local Gradle cache (DSH sandbox cannot write outside the workspace)
org.gradle.user.home=D:/agent/createUltimine/.gradle-home

# Run the Kotlin compiler inside the Gradle daemon (the DSH sandbox blocks the Kotlin daemon's temp-dir liveness file)
kotlin.compiler.execution.strategy=in-process
